<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Risk Check</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Cardiovascular Risk Quick-Check</h1>

        <form id="risk-form">
            <div class="form-grid">
                <div class="form-field">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" min="40" max="69" required>
                </div>

                <div class="form-field">
                    <label for="sex">Sex</label>
                    <select id="sex" name="sex" required>
                        <option value="">Please choose</option>
                        <option value="female">Female</option>
                        <option value="male">Male</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="systolic-bp">Systolic Blood Pressure (mmHg)</label>
                    <input type="number" id="systolic-bp" name="systolicBp" min="90" max="200" required>
                </div>

                <div class="form-field">
                    <label for="total-cholesterol">Total Cholesterol (mg/dl)</label>
                    <input type="number" id="total-cholesterol" name="totalCholesterol" min="115" max="350" required>
                </div>

                <div class="form-field">
                    <label for="hdl">HDL (mg/dl)</label>
                    <input type="number" id="hdl" name="hdl" min="25" max="100" required>
                </div>
            </div>

            <div class="checkboxes">
                <label>
                    <input type="checkbox" id="smoker" name="smoker">
                    Smoker
                </label>
                <label>
                    <input type="checkbox" id="diabetes" name="diabetes">
                    Diabetes
                </label>
            </div>

            <div class="buttons">
                <button type="submit">Calculate</button>
                <button type="reset">Reset</button>
            </div>
        </form>

        <section id="risk-result" aria-live="polite" hidden>
            <h2>Your estimated 10-year risk</h2>
            <p id="risk-value"></p>
            <p id="risk-category"></p>
            <div class="risk-bar" role="img" aria-label="Estimated 10-year cardiovascular risk">
                <div id="risk-marker" aria-hidden="true"></div>
            </div>
            <div class="risk-scale" aria-hidden="true">
                <span>0 %</span>
                <span>5 %</span>
                <span>10 %</span>
                <span>20 %+</span>
            </div>

            <div class="what-if">
                <h3>What if</h3>
                <div class="checkboxes what-if-checkboxes">
                    <label>
                        <input type="checkbox" id="stopSmoking" name="stopSmoking">
                        Stop smoking
                    </label>
                    <label>
                        <input type="checkbox" id="bpBelow130" name="bpBelow130">
                        Systolic Blood Pressure &lt; 130 mmHg
                    </label>
                    <label>
                        <input type="checkbox" id="hdl55" name="hdl55">
                        HDL &gt; 55mg/dl
                    </label>
                    <label>
                        <input type="checkbox" id="cholesterol190" name="cholesterol190">
                        Total Cholesterol &lt; 190 mg/dl
                    </label>
                </div>
            </div>

            <section id="what-if-result" aria-live="polite" hidden>
                <h3>Your estimated risk with these changes</h3>
                <p id="what-if-risk-value"></p>
                <p id="what-if-risk-category"></p>
                <div id="what-if-risk-bar" class="risk-bar" role="img" aria-label="Estimated lower 10-year cardiovascular risk">
                    <div id="what-if-risk-marker" aria-hidden="true"></div>
                </div>
                <div class="risk-scale" aria-hidden="true">
                    <span>0 %</span>
                    <span>5 %</span>
                    <span>10 %</span>
                    <span>20 %+</span>
                </div>
            </section>
        </section>

        <dialog id="diabetes-dialog" aria-labelledby="diabetes-dialog-title">
            <div class="dialog-content">
                <h2 id="diabetes-dialog-title">A quick note</h2>
                <p>Not applicable. Please use other methods!</p>
                <button type="button" id="close-dialog">Got it</button>
            </div>
        </dialog>
    </main>

    <script src="script.js"></script>
</body>
</html>
